server:
  port: 8080
  shutdown: graceful

jwt:
  secret-ref: ${SEALMAIL_JWT_SECRET_REF:env:SEALMAIL_JWT_SECRET}
  token-validity-in-seconds: 86400

spring:
  application:
    name: sealmail-gateway

  profiles:
    active: postgres

  datasource:
    url: ${SEALMAIL_DB_URL:jdbc:postgresql://localhost:5432/sealmail}
    username: ${SEALMAIL_DB_USERNAME:sealmail}
    password: ${SEALMAIL_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 6
    validate-on-migrate: true

# SealMail Configuration
sealmail:
  # SMTP Server Configuration
  smtp:
    server:
      bind-address: 0.0.0.0
      port: 10025
      host-name: sealmail-gateway
      max-connections: 100
      max-message-size: 52428800

  # Certificate Validation Security Settings
  security:
    crl:
      enabled: true
    ocsp:
      enabled: true
      timeout: 10000

  # Postfix integration: Postfix receives on 25, sends through content_filter to 10025,
  # app processes mail, then reinjects back to Postfix on 10026/10027.
  postfix:
    enabled: true
    host: 127.0.0.1
    after-filter-port: 10026
    outbound-port: 10027
    envelope-from: ${SEALMAIL_POSTFIX_ENVELOPE_FROM:}
    timeout: 10000

  mail-auth:
    trusted-source:
      # Only when the global mail-auth policy uses TRUSTED_HEADERS will these
      # relays be allowed to provide the original public client IP.
      trusted-relay-cidrs:
        - 127.0.0.1/32
        - ::1/128
      original-ip-headers:
        - X-Original-Client-IP
        - X-Forwarded-For
    dkim:
      private-key-path:
      private-key-secret-ref:

  smime:
    crypto:
      standard:
        recipient-key-algorithm-oid: 1.2.840.113549.1.1.1
        recipient-key-cipher: RSA/ECB/PKCS1Padding
        content-encryption-algorithm-oid: 2.16.840.1.101.3.4.1.42
        content-cipher: AES/CBC/PKCS5Padding
        content-key-algorithm: AES
        content-key-size-bits: 256
        signature-algorithm: SHA256withRSA
      gm:
        recipient-key-algorithm-oid: 1.2.156.10197.1.301.3.2.1
        recipient-key-cipher: SM2WITHSM3
        content-encryption-algorithm-oid: 1.2.156.10197.1.104.2
        content-cipher: SM4/CBC/PKCS7Padding
        content-key-algorithm: SM4
        content-key-size-bits: 128
        signature-algorithm: SM3withSM2

  # Internal CA Settings
  ca:
    # Prefix for CRL Distribution Point URLs embedded in issued certs.
    # Full URL = {crl-base-url}{caCertId}; serve at GET /api/v1/crl/{caCertId}
    crl-base-url: http://localhost:8080/api/v1/crl/
    default-root-validity-days: 3650
    default-intermediate-validity-days: 1825
    default-end-entity-validity-days: 365

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    root: INFO
    com.sealmail: INFO
    com.sealmail.app.usecase: INFO
    com.sealmail.infra.crypto: INFO
    com.sealmail.infra.mail.pipeline: INFO
    org.springframework.integration: INFO
    org.springframework.transaction: INFO
    org.hibernate.SQL: WARN
    org.flywaydb.core: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    com.sealmail: DEBUG
    org.springframework.integration: INFO

---
# PostgreSQL Profile (default)
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: ${SEALMAIL_DB_URL:jdbc:postgresql://localhost:5432/sealmail}
    username: ${SEALMAIL_DB_USERNAME:sealmail}
    password: ${SEALMAIL_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
# PostgreSQL-backed test profile
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: ${SEALMAIL_TEST_DB_URL:jdbc:postgresql://localhost:5432/sealmail}
    username: ${SEALMAIL_TEST_DB_USERNAME:sealmail}
    password: ${SEALMAIL_TEST_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    schemas: sealmail_test
    default-schema: sealmail_test
    clean-disabled: false
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sealmail_test

logging:
  level:
    com.sealmail: DEBUG
    org.springframework.integration: INFO

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.sealmail: INFO
