# SealMail Kona Edge example configuration.
# Standard SMTP/TLS remains on Postfix. These ports are only for TLCP/ShangMi TLS 1.3 traffic.

edge.inbound.enabled=true
edge.inbound.bind-address=0.0.0.0
edge.inbound.starttls-port=2525
edge.inbound.implicit-tls-port=2465
edge.inbound.backlog=128
edge.inbound.max-connections=1024

edge.outbound.enabled=true
edge.outbound.bind-address=127.0.0.1
edge.outbound.port=2526
edge.outbound.backlog=128
edge.outbound.max-connections=512

# Postfix internal smtpd for GM inbound mail accepted by Edge.
edge.postfix.host=127.0.0.1
edge.postfix.port=2530

edge.connect-timeout-ms=10000
edge.read-timeout-ms=60000
edge.max-message-size-bytes=52428800
edge.max-line-length-bytes=16384
edge.max-recipients=100

edge.admin.enabled=true
edge.admin.bind-address=127.0.0.1
edge.admin.port=2727

# Kona/TLCP runtime material. Do not commit real certificates, keys, or keystores.
edge.tls.protocols=TLCPv1.1,TLCP,TLSv1.3
edge.tls.cipher-suites=TLS_SM4_GCM_SM3,TLS_SM4_CCM_SM3
edge.tls.key-store=/run/secrets/sealmail-gm-edge.p12
edge.tls.key-store-password=${SEALMAIL_GM_EDGE_KEYSTORE_PASSWORD}
edge.tls.key-store-type=PKCS12
edge.tls.trust-store=/run/secrets/sealmail-gm-trust.p12
edge.tls.trust-store-password=${SEALMAIL_GM_EDGE_TRUSTSTORE_PASSWORD}
edge.tls.trust-store-type=PKCS12
edge.tls.trust-all=false

# Domain route format: pattern=host:port, pattern=IMPLICIT_TLS://host:port
# The default route security is STARTTLS.
# Patterns support exact domains, .example.cn suffixes, *.example.cn suffixes, and * default.
edge.outbound.routes=.partner.example.cn=gm-relay.partner.example.cn:2525
