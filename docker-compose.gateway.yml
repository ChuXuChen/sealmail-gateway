name: sealmail-gateway-${SEALMAIL_SITE:-node}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SEALMAIL_DB_NAME:-sealmail}
      POSTGRES_USER: ${SEALMAIL_DB_USERNAME:-sealmail}
      POSTGRES_PASSWORD: ${SEALMAIL_DB_PASSWORD:?Set SEALMAIL_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SEALMAIL_DB_USERNAME:-sealmail} -d ${SEALMAIL_DB_NAME:-sealmail}"]
      interval: 10s
      timeout: 5s
      retries: 12

  sealmail-backend:
    build:
      context: .
      dockerfile: sealmail-backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: ${SEALMAIL_JAVA_TOOL_OPTIONS:--Xms256m -Xmx1024m}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-postgres}
      SEALMAIL_CORS_ALLOWED_ORIGINS: ${SEALMAIL_CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost:8089,http://127.0.0.1:8089}
      SEALMAIL_DB_URL: jdbc:postgresql://postgres:5432/${SEALMAIL_DB_NAME:-sealmail}
      SEALMAIL_DB_USERNAME: ${SEALMAIL_DB_USERNAME:-sealmail}
      SEALMAIL_DB_PASSWORD: ${SEALMAIL_DB_PASSWORD:?Set SEALMAIL_DB_PASSWORD}
      SEALMAIL_JWT_SECRET: ${SEALMAIL_JWT_SECRET:?Set SEALMAIL_JWT_SECRET}
      SEALMAIL_JWT_TOKEN_VALIDITY_SECONDS: ${SEALMAIL_JWT_TOKEN_VALIDITY_SECONDS:-3600}
      SEALMAIL_KEYSTORE_PATH: /var/lib/sealmail/keystore/sealmail-cert-keys.p12
      SEALMAIL_KEYSTORE_PASSWORD: ${SEALMAIL_KEYSTORE_PASSWORD:?Set SEALMAIL_KEYSTORE_PASSWORD}
      SEALMAIL_RAW_CONTENT_ENCRYPTION_KEY: ${SEALMAIL_RAW_CONTENT_ENCRYPTION_KEY:?Set SEALMAIL_RAW_CONTENT_ENCRYPTION_KEY}
      SEALMAIL_SMTP_SERVER_BIND_ADDRESS: 0.0.0.0
      SEALMAIL_SMTP_SERVER_PORT: 10025
      SEALMAIL_POSTFIX_ENABLED: "true"
      SEALMAIL_POSTFIX_HOST: postfix
      SEALMAIL_POSTFIX_AFTER_FILTER_PORT: 10026
      SEALMAIL_POSTFIX_OUTBOUND_PORT: 10027
      SEALMAIL_POSTFIX_TIMEOUT: 30000
      SEALMAIL_GM_EDGE_OUTBOUND_HOST: sealmail-edge
      SEALMAIL_GM_EDGE_OUTBOUND_PORT: 2526
      SEALMAIL_STANDARD_TLS_VERIFY_PEER_CERTIFICATE: ${SEALMAIL_STANDARD_TLS_VERIFY_PEER_CERTIFICATE:-true}
      SEALMAIL_STANDARD_TLS_TRUST_ALL: ${SEALMAIL_STANDARD_TLS_TRUST_ALL:-false}
      SEALMAIL_STANDARD_TLS_TRUST_STORE_PATH: ${SEALMAIL_STANDARD_TLS_TRUST_STORE_PATH:-}
      SEALMAIL_STANDARD_TLS_TRUST_STORE_PASSWORD: ${SEALMAIL_STANDARD_TLS_TRUST_STORE_PASSWORD:-}
      SEALMAIL_STANDARD_TLS_TRUST_STORE_TYPE: ${SEALMAIL_STANDARD_TLS_TRUST_STORE_TYPE:-PKCS12}
      SEALMAIL_CA_CRL_BASE_URL: ${SEALMAIL_CA_CRL_BASE_URL:-http://localhost:8080/api/v1/crl/}
      SEALMAIL_MAIL_AUTH_TRUSTED_SOURCE_TRUSTED_RELAY_CIDRS_0: ${SEALMAIL_MAIL_AUTH_TRUSTED_SOURCE_TRUSTED_RELAY_CIDRS_0:-127.0.0.1/32}
      SEALMAIL_MAIL_AUTH_TRUSTED_SOURCE_TRUSTED_RELAY_CIDRS_1: ${SEALMAIL_MAIL_AUTH_TRUSTED_SOURCE_TRUSTED_RELAY_CIDRS_1:-::1/128}
      SEALMAIL_MAIL_AUTH_TRUSTED_SOURCE_TRUSTED_RELAY_CIDRS_2: ${SEALMAIL_MAIL_AUTH_TRUSTED_SOURCE_TRUSTED_RELAY_CIDRS_2:-10.0.0.0/8}
      SEALMAIL_MAIL_AUTH_TRUSTED_SOURCE_TRUSTED_RELAY_CIDRS_3: ${SEALMAIL_MAIL_AUTH_TRUSTED_SOURCE_TRUSTED_RELAY_CIDRS_3:-172.16.0.0/12}
      SEALMAIL_MAIL_AUTH_TRUSTED_SOURCE_TRUSTED_RELAY_CIDRS_4: ${SEALMAIL_MAIL_AUTH_TRUSTED_SOURCE_TRUSTED_RELAY_CIDRS_4:-192.168.0.0/16}
      SEALMAIL_AUTH_USERS_0_USER_ID: ${SEALMAIL_ADMIN_USER_ID:-admin}
      SEALMAIL_AUTH_USERS_0_USERNAME: ${SEALMAIL_ADMIN_USERNAME:-admin}
      SEALMAIL_AUTH_USERS_0_EMAIL: ${SEALMAIL_ADMIN_EMAIL:-admin@example.invalid}
      SEALMAIL_AUTH_USERS_0_PASSWORD_SECRET_REF: env:SEALMAIL_ADMIN_PASSWORD
      SEALMAIL_ADMIN_PASSWORD: ${SEALMAIL_ADMIN_PASSWORD:?Set SEALMAIL_ADMIN_PASSWORD}
      SEALMAIL_AUTH_USERS_0_ROLES_0: SUPER_ADMIN
      SEALMAIL_AUTH_USERS_0_MANAGED_DOMAINS_0: ${LOCAL_DOMAIN:?Set LOCAL_DOMAIN}
    volumes:
      - backend-keystore:/var/lib/sealmail/keystore
      - ./runtime/${SEALMAIL_SITE:-node}/standard-tls:/run/secrets/standard-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      sealmail-backend:
        condition: service_healthy
    environment:
      BACKEND_UPSTREAM: http://sealmail-backend:8080
      NGINX_ENVSUBST_FILTER: ^BACKEND_UPSTREAM$
    ports:
      - "${SEALMAIL_FRONTEND_BIND:-127.0.0.1}:${SEALMAIL_FRONTEND_HTTP_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  postfix:
    build:
      context: .
      dockerfile: docker/postfix/Dockerfile
    restart: unless-stopped
    depends_on:
      sealmail-backend:
        condition: service_healthy
    environment:
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:?Set LOCAL_DOMAIN}
      REMOTE_DOMAIN: ${REMOTE_DOMAIN:-}
      REMOTE_ROUTE_MODE: ${REMOTE_ROUTE_MODE:-standard}
      REMOTE_STANDARD_HOST: ${REMOTE_STANDARD_HOST:-}
      REMOTE_STANDARD_PORT: ${REMOTE_STANDARD_PORT:-2527}
      SEALMAIL_DEPLOYMENT_MODE: ${SEALMAIL_DEPLOYMENT_MODE:-debug}
      LOCAL_DELIVERY_MODE: ${LOCAL_DELIVERY_MODE:-mailpit}
      LOCAL_DELIVERY_HOST: ${LOCAL_DELIVERY_HOST:-mailpit}
      LOCAL_DELIVERY_PORT: ${LOCAL_DELIVERY_PORT:-1025}
      LOCAL_DELIVERY_TRANSPORT: ${LOCAL_DELIVERY_TRANSPORT:-smtp-clear}
      POSTFIX_HOSTNAME: ${POSTFIX_HOSTNAME:-mail.local}
      POSTFIX_SMTPD_TLS_SECURITY_LEVEL: ${POSTFIX_SMTPD_TLS_SECURITY_LEVEL:-may}
      POSTFIX_REMOTE_TLS_SECURITY_LEVEL: ${POSTFIX_REMOTE_TLS_SECURITY_LEVEL:-encrypt}
      POSTFIX_REMOTE_TLS_CA_FILE: ${POSTFIX_REMOTE_TLS_CA_FILE:-}
      POSTFIX_REMOTE_TLS_FINGERPRINT_DIGEST: ${POSTFIX_REMOTE_TLS_FINGERPRINT_DIGEST:-sha256}
      POSTFIX_REMOTE_TLS_POLICY_LEVEL: ${POSTFIX_REMOTE_TLS_POLICY_LEVEL:-}
      POSTFIX_REMOTE_TLS_POLICY_MATCH: ${POSTFIX_REMOTE_TLS_POLICY_MATCH:-}
      POSTFIX_REMOTE_TLS_POLICY_FINGERPRINT: ${POSTFIX_REMOTE_TLS_POLICY_FINGERPRINT:-}
      POSTFIX_REMOTE_TLS_POLICY_PROTOCOLS: ${POSTFIX_REMOTE_TLS_POLICY_PROTOCOLS:-}
      POSTFIX_REMOTE_TLS_POLICY_CIPHERS: ${POSTFIX_REMOTE_TLS_POLICY_CIPHERS:-}
      POSTFIX_PUBLIC_RELAY_REMOTE_DOMAIN: ${POSTFIX_PUBLIC_RELAY_REMOTE_DOMAIN:-}
      POSTFIX_EXTRA_MYNETWORKS: ${POSTFIX_EXTRA_MYNETWORKS:-}
      SEALMAIL_HOST: sealmail-backend
      SEALMAIL_PORT: 10025
      MAILPIT_HOST: mailpit
      MAILPIT_PORT: 1025
      EDGE_OUTBOUND_HOST: sealmail-edge
      EDGE_OUTBOUND_PORT: 2526
      POSTFIX_AFTER_FILTER_PORT: 10026
      POSTFIX_OUTBOUND_PORT: 10027
      EDGE_INBOUND_POSTFIX_PORT: 2530
    ports:
      - "${POSTFIX_PUBLIC_SMTP_PORT:-2527}:25"
    volumes:
      - postfix-tls:/etc/postfix/tls
      - ./runtime/${SEALMAIL_SITE:-node}/standard-tls:/run/secrets/standard-tls:ro
    healthcheck:
      test: ["CMD-SHELL", "postfix status >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  sealmail-edge:
    build:
      context: .
      dockerfile: docker/sealmail-edge/Dockerfile
    restart: unless-stopped
    profiles:
      - gm
    depends_on:
      postfix:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: ${EDGE_JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m}
      EDGE_POSTFIX_HOST: postfix
      EDGE_POSTFIX_PORT: 2530
      EDGE_INBOUND_ENABLED: ${EDGE_INBOUND_ENABLED:-true}
      EDGE_OUTBOUND_ENABLED: ${EDGE_OUTBOUND_ENABLED:-true}
      EDGE_ADMIN_ENABLED: ${EDGE_ADMIN_ENABLED:-true}
      EDGE_ADMIN_BIND_ADDRESS: 0.0.0.0
      EDGE_TLS_KEY_STORE: ${EDGE_TLS_KEY_STORE:-}
      EDGE_TLS_KEY_STORE_PASSWORD: ${EDGE_TLS_KEY_STORE_PASSWORD:-}
      EDGE_TLS_TRUST_STORE: ${EDGE_TLS_TRUST_STORE:-}
      EDGE_TLS_TRUST_STORE_PASSWORD: ${EDGE_TLS_TRUST_STORE_PASSWORD:-}
      EDGE_TLS_TRUST_ALL: ${EDGE_TLS_TRUST_ALL:-false}
      EDGE_OUTBOUND_ROUTES: ${EDGE_OUTBOUND_ROUTES:-}
    volumes:
      - ./runtime/${SEALMAIL_SITE:-node}/edge-secrets:/run/secrets/edge:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2727/health | grep -q '\"ready\":true'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  edge-starttls-public:
    image: alpine/socat:latest
    restart: unless-stopped
    profiles:
      - gm
    entrypoint: ["socat"]
    depends_on:
      sealmail-edge:
        condition: service_healthy
    command:
      - TCP-LISTEN:2525,fork,reuseaddr
      - TCP:sealmail-edge:2525
    ports:
      - "${EDGE_STARTTLS_PUBLIC_PORT:-2525}:2525"

  edge-implicit-tls-public:
    image: alpine/socat:latest
    restart: unless-stopped
    profiles:
      - gm
    entrypoint: ["socat"]
    depends_on:
      sealmail-edge:
        condition: service_healthy
    command:
      - TCP-LISTEN:2465,fork,reuseaddr
      - TCP:sealmail-edge:2465
    ports:
      - "${EDGE_IMPLICIT_TLS_PUBLIC_PORT:-2465}:2465"

  gateway-https:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - https
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      SEALMAIL_PUBLIC_HOST: ${SEALMAIL_PUBLIC_HOST:-}
    ports:
      - "${SEALMAIL_HTTPS_HTTP_PORT:-80}:80"
      - "${SEALMAIL_HTTPS_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    profiles:
      - debug
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_DEBUG_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db

  postgres-debug:
    image: alpine/socat:latest
    restart: unless-stopped
    profiles:
      - debug
    entrypoint: ["socat"]
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - TCP-LISTEN:5432,fork,reuseaddr
      - TCP:postgres:5432
    ports:
      - "127.0.0.1:${SEALMAIL_DB_HOST_PORT:-5433}:5432"

  backend-http-debug:
    image: alpine/socat:latest
    restart: unless-stopped
    profiles:
      - debug
    entrypoint: ["socat"]
    depends_on:
      sealmail-backend:
        condition: service_healthy
    command:
      - TCP-LISTEN:8080,fork,reuseaddr
      - TCP:sealmail-backend:8080
    ports:
      - "127.0.0.1:${SEALMAIL_BACKEND_HTTP_PORT:-8080}:8080"

  backend-smtp-debug:
    image: alpine/socat:latest
    restart: unless-stopped
    profiles:
      - debug
    entrypoint: ["socat"]
    depends_on:
      sealmail-backend:
        condition: service_healthy
    command:
      - TCP-LISTEN:10025,fork,reuseaddr
      - TCP:sealmail-backend:10025
    ports:
      - "127.0.0.1:${SEALMAIL_SMTP_DEBUG_PORT:-10025}:10025"

  edge-admin-debug:
    image: alpine/socat:latest
    restart: unless-stopped
    profiles:
      - gm-debug
    entrypoint: ["socat"]
    depends_on:
      sealmail-edge:
        condition: service_healthy
    command:
      - TCP-LISTEN:2727,fork,reuseaddr
      - TCP:sealmail-edge:2727
    ports:
      - "127.0.0.1:${EDGE_ADMIN_HOST_PORT:-2727}:2727"

volumes:
  postgres-data:
  backend-keystore:
  postfix-tls:
  mailpit-data:
  caddy-data:
  caddy-config:
