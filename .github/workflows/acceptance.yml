name: Acceptance

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Backend tests
        run: |
          MAVEN_USER_HOME=/tmp/sealmail-m2 \
          ./mvnw -Dmaven.repo.local=/tmp/sealmail-m2/repository -f sealmail-backend/pom.xml test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sealmail-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sealmail-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  sensitive-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sensitive material scan
        run: ./ops/scan-sensitive-material.sh
