services:
  postgres:
    image: postgres:16
    container_name: sealmail-postgres
    environment:
      POSTGRES_DB: ${SEALMAIL_DB_NAME:-sealmail}
      POSTGRES_USER: ${SEALMAIL_DB_USERNAME:-sealmail}
      POSTGRES_PASSWORD: ${SEALMAIL_DB_PASSWORD:?Set SEALMAIL_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SEALMAIL_DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SEALMAIL_DB_USERNAME:-sealmail} -d ${SEALMAIL_DB_NAME:-sealmail}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: sealmail-backend/Dockerfile
    container_name: sealmail-backend
    user: "${SEALMAIL_UID:-1000}:${SEALMAIL_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SEALMAIL_DB_URL: jdbc:postgresql://postgres:5432/${SEALMAIL_DB_NAME:-sealmail}
      SEALMAIL_DB_USERNAME: ${SEALMAIL_DB_USERNAME:-sealmail}
      SEALMAIL_DB_PASSWORD: ${SEALMAIL_DB_PASSWORD:?Set SEALMAIL_DB_PASSWORD in .env}
      SEALMAIL_JWT_SECRET: ${SEALMAIL_JWT_SECRET:?Set SEALMAIL_JWT_SECRET in .env}
      SEALMAIL_KEYSTORE_PATH: /var/lib/sealmail/keystore/sealmail-cert-keys.p12
      SEALMAIL_KEYSTORE_PASSWORD: ${SEALMAIL_KEYSTORE_PASSWORD:?Set SEALMAIL_KEYSTORE_PASSWORD in .env}
      SEALMAIL_RAW_CONTENT_ENCRYPTION_KEY: ${SEALMAIL_RAW_CONTENT_ENCRYPTION_KEY:?Set SEALMAIL_RAW_CONTENT_ENCRYPTION_KEY in .env}
      SEALMAIL_INIT_CERTS_ENABLED: ${SEALMAIL_INIT_CERTS_ENABLED:-true}
    ports:
      - "127.0.0.1:${SEALMAIL_BACKEND_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${SEALMAIL_SMTP_PORT:-10025}:10025"
    volumes:
      - ./runtime/keystore:/var/lib/sealmail/keystore

volumes:
  postgres-data:
