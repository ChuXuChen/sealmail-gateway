spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/studentms?setUnicode=true&characterEncoding=utf8&useAffectedRows=true
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis:
  type-aliases-package: com.auggie.student_server.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名自动映射

server:
  port: 10086

# 文件上传配置
file:
  upload-dir: ./uploads/

# AI配置
anthropic:
  # Claude API key (实际项目中应该存储在环境变量或加密文件中)
  api:
    key: b731f82d-dc13-4b70-a841-999b2faeffe7
  # 使用的模型
  model: ark-code-latest
  # API基础URL
  base-url: https://ark.cn-beijing.volces.com/api/coding
  # 请求超时时间（毫秒）
  timeout: 60000

# AI功能开关
ai:
  # 是否启用AI功能
  enabled: true
  # 组卷并发线程数
  generation-threads: 5
  # 评分并发线程数
  grading-threads: 10
